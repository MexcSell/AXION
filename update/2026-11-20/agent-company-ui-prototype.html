function notify(msg){let n=document.getElementById('toastbox');if(!n)return;let t=document.createElement('div');t.className='toast';t.innerHTML=I('check',16)+`<span>${esc(msg)}</span>`;n.appendChild(t);setTimeout(()=>t.remove(),3400)}
function switchPage(p){if(p==='agent')p='agents';state.page=p;state.tab='';state.mobile=false;state.help=false;state.modal=null;state.palette=false;render();window.scrollTo(0,0);}
function doAction(a){if(a==='theme'||a==='darktheme'||a==='lighttheme'){state.theme=a==='theme'?(state.theme==='dark'?'light':'dark'):a==='darktheme'?'dark':'light';store.set('ac-theme',state.theme);render(true);notify(`Switched to ${state.theme} mode`);return}if(a==='systemtheme'){state.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';store.set('ac-theme',state.theme);render(true);return}if(a==='mobile'||a==='closemobile'){state.mobile=!state.mobile;render();return}if(a==='palette'){state.palette=true;render(true);document.getElementById('paletteInput')?.focus();return}if(a==='closepalette'){state.palette=false;render(true);return}if(a==='help'){state.help=!state.help;state.helpTopic=null;render(true);return}if(a==='closemodal'||a==='overlayclose'){state.modal=null;render(true);return}if(a==='notifications'){switchPage('notifications');return}if(a==='newmission'){state.modal='newmission';state.wizardStep=0;state.openModalData={};render(true);return}if(a==='wizardback'){state.wizardStep=Math.max(0,state.wizardStep-1);render(true);return}if(a==='modalconfirm'){processModal();return}if(a==='sendcommand'){let inp=document.querySelector('#commandInput'),v=inp?.value.trim();if(!v){notify('Enter a command before sending');return}state.messages.push({agent:state.selectedAgent,text:v});render(true);notify('Instruction recorded in UI demo');document.getElementById('chatmsgs')?.scrollTo(0,9999);return}if(a==='copychat'){navigator.clipboard?.writeText(document.querySelector('.chatmsgs')?.innerText||'');notify('Conversation copied');return}if(a==='browser'){switchPage('browser');state.tab='Live View';render();return}if(a==='missions'){switchPage('missions');return}if(a==='pause'||a==='refreshsession'||a==='screenshot'){notify('Simulated browser action — no live browser connected');return}if(a==='download'||a==='export'){const blob=new Blob(['AXION UI concept — sample artifact manifest\nGenerated in browser prototype\n'],{type:'text/plain'});const x=document.createElement('a');x.href=URL.createObjectURL(blob);x.download='AXION-demo-artifact-manifest.txt';x.click();URL.revokeObjectURL(x.href);notify('Demo manifest downloaded');return}if(a==='saveprefs'||a==='playground'||a==='settings-toggle'||a==='previewtheme'){notify('Appearance / settings demo — not saved to server');return}if(a==='attach'||a==='image'){let f=document.createElement('input');f.type='file';if(a==='image')f.accept='image/*';f.onchange=()=>notify(f.files?.[0]?.name+' selected (demo)');f.click();return}if(a.startsWith('agent:')){state.agentDetail=a.split(':')[1];state.page='agents';state.tab='Directory';state.modal='agentprofile';state.detailTab='Profile';render();notify(`Viewing ${state.agentDetail} profile concept`);return}if(a.startsWith('conversation:')){state.selectedAgent=a.split(':')[1];switchPage('missions');return}if(a.startsWith('density:')){state.density=a.split(':')[1];store.set('ac-density',state.density);render(true);return}if(['inspect','taskinfo','newagent','newmodel','invite','newsession','newexperiment','grant','reviewapproval','previewresult','showreport','avatar','profile','filters'].includes(a)){state.modal=a;render(true);return}notify('UI action simulated; backend integration is a future stage')}
function processModal(){let m=state.modal;if(m==='newmission'){if(state.wizardStep===0){let title=document.querySelector('#newTitle')?.value.trim(),description=document.querySelector('#newDescription')?.value.trim();if(!title||!description){notify('Please fill in the title and objective');return}state.openModalData={title,description}}if(state.wizardStep===1)state.openModalData.url=document.querySelector('#resourceUrl')?.value||'';if(state.wizardStep<3){state.wizardStep++;render(true);return}missions.unshift({id:'MSC-NEW',title:state.openModalData.title,description:state.openModalData.description,status:'waiting',progress:0,agents:0,tasks:0,spent:'$0.00'});state.selectedMission=0;state.page='missions';state.tab='Overview';notify('Mission created in local UI demo')}else if(m==='editmission'){let t=document.getElementById('editTitle')?.value.trim(),d=document.getElementById('editDescription')?.value.trim();if(t){mission().title=t;mission().description=d||mission().description}notify('Demo mission updated')}else if(m==='deletemission'){missions.splice(state.selectedMission,1);state.selectedMission=0;notify('Demo mission deleted')}else if(m==='reviewapproval'){notify('Approval decision simulated; no external effect')}else notify('Saved to local UI demo (no backend)');state.modal=null;render(true)}
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>switchPage(el.dataset.page)));document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;render(true)}));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-action]')!==el)return;doAction(el.dataset.action)}));document.querySelectorAll('[data-help]').forEach(el=>el.addEventListener('click',()=>{state.help=true;state.helpTopic=el.dataset.help;render(true)}));document.querySelectorAll('[data-agent]').forEach(el=>el.addEventListener('click',()=>{state.selectedAgent=el.dataset.agent;state.counterpart=state.selectedAgent==='Atlas'?'Research':'Superior';render(true)}));document.querySelectorAll('[data-agent-profile-tab]').forEach(el=>el.addEventListener('click',()=>{state.detailTab=el.dataset.agentProfileTab;render(true)}));document.querySelectorAll('[data-agent-detail]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('button'))return;state.agentDetail=el.dataset.agentDetail;state.modal='agentprofile';state.detailTab='Profile';render(true)}));document.querySelectorAll('[data-counterpart]').forEach(el=>el.addEventListener('click',()=>{state.counterpart=el.dataset.counterpart;render(true)}));document.querySelectorAll('[data-select-mission]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-edit-mission], [data-delete-mission]'))return;state.selectedMission=Number(el.dataset.selectMission);render(true)}));document.querySelectorAll('[data-edit-mission]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();state.selectedMission=Number(el.dataset.editMission);state.modal='editmission';render(true)}));document.querySelectorAll('[data-delete-mission]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();state.selectedMission=Number(el.dataset.deleteMission);state.modal='deletemission';render(true)}));document.querySelectorAll('[data-palette]').forEach(el=>el.addEventListener('click',()=>notify(`Accent selected: ${el.dataset.palette}`)));document.querySelectorAll('[data-preset]').forEach(el=>el.addEventListener('click',()=>notify(`${el.dataset.preset} style preview selected`)));document.querySelectorAll('[data-statusfilter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.statusfilter;state.modal=null;notify(`Filter ${state.filter} selected (demo)`);render(true)}));let mf=document.querySelector('#missionFilter');if(mf)mf.addEventListener('input',e=>{let val=e.target.value,sel=e.target.selectionStart;state.missionSearch=val;let list=document.querySelector('.missions-list');if(list){let vis=missions.map((m,i)=>({...m,i})).filter(m=>m.title.toLowerCase().includes(val.toLowerCase()));list.innerHTML=vis.length?vis.map(m=>`<div class="mission-item ${m.i===state.selectedMission?'active':''}" data-select-mission="${m.i}"><div class="mi-title">${esc(m.title)}</div><div class="mi-status"><span class="status-dot ${m.status}"></span>${status(m.status)}</div><div class="mi-desc">${esc(m.description)}</div></div>`).join(''):'<div class="empty">No matching missions</div>';list.querySelectorAll('[data-select-mission]').forEach(el=>el.addEventListener('click',()=>{state.selectedMission=+el.dataset.selectMission;render(true)}));}});let pi=document.getElementById('paletteInput');if(pi)pi.addEventListener('input',e=>{let v=e.target.value.toLowerCase();document.querySelectorAll('.palette-item').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(v)?'flex':'none')});document.querySelectorAll('[title]').forEach(el=>{el.addEventListener('pointerenter',e=>{if(matchMedia('(pointer:coarse)').matches)return;let t=document.getElementById('tooltip');if(!t)return;t.textContent=el.getAttribute('title');t.style.display='block';let r=el.getBoundingClientRect();t.style.top=Math.min(window.innerHeight-35,r.bottom+6)+'px';t.style.left=Math.min(window.innerWidth-240,Math.max(5,r.left))+'px'});el.addEventListener('pointerleave',()=>{let t=document.getElementById('tooltip');if(t)t.style.display='none'})})}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.palette=!state.palette;render(true);document.querySelector('#paletteInput')?.focus()}if(e.key==='Escape'){if(state.modal||state.palette||state.help){state.modal=null;state.palette=false;state.help=false;render(true)}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-agent],[data-select-mission],[data-agent-detail]')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.id==='commandInput'){e.preventDefault();doAction('sendcommand')}});
render();
</script>
