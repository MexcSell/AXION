const ib=(name,action,tip,extra='')=>`<button type="button" class="ib ${extra}" data-act="${h(action)}" title="${h(tip)}" aria-label="${h(tip)}">${icon(name,16)}</button>`;

const secHead=(title,description,actions='')=>`<div class="heading"><div><div class="eyebrow">AUTONOMOUS COMPANY OS / ${h(title)}</div><h1>${h(title)}</h1><p>${h(description)}</p></div><div class="header-actions">${actions}${help(title)}</div></div>`;

function shell(){document.documentElement.dataset.theme=S.theme;document.documentElement.dataset.style=S.style;document.documentElement.dataset.density=S.density;document.documentElement.dataset.motion=S.motion;return `<div class="shell"><aside class="sidebar"><div class="logo"><div class="emblem">${icon('layers',23)}</div><div class="brand">AXoR<small>AUTONOMOUS COMPANY OS</small></div></div><div class="nav-area">${nav.map(([title,items])=>`<div class="nav-section">${title}</div>${items.map(([key,label,ic])=>`<button class="nav-item ${S.page===key?'active':''}" data-page="${key}" title="${label}">${icon(ic,16)}<span>${label}</span>${key==='approvals'?'<b class="nav-number">3</b>':''}</button>`).join('')}`).join('')}</div><div class="nav-bottom"><div class="workspace"><div class="avatar-owner">AC</div><div><strong>Acme AI Company</strong><small><span style="color:#54e0af">●</span> Prototype environment</small></div></div></div></aside><section class="main"><header class="topbar"><div class="top-left"><div class="crumb"><span>Workspace</span>${icon('chevron',12)}<b>${h(nav.flatMap(x=>x[1]).find(x=>x[0]===S.page)?.[1]||S.page)}</b></div><select class="dropdown" id="workspace-select" title="Choose workspace"><option>AXoR Main</option><option>Development Lab</option></select></div><div class="top-actions"><button class="top-search" data-act="palette" aria-label="Search / command palette">${icon('search',14)} Search anything... <kbd>⌘ K</kbd></button><div class="online"><span class="dot-live"></span> DEMO ONLINE</div>${ib(S.theme==='light'?'moon':'sun','theme','Toggle light / dark theme')}${ib('bell','page:approvals','Open decisions and notifications')}${ib('help','help:General help','Open help')}${ib('settings','page:appearance','Appearance settings')}<div class="avatar-owner" title="Owner profile">OC</div></div></header><div class="content page-enter" id="content">${page()}</div></section></div>${S.chatOpen?`<div class="chat-float" style="display:none"></div>`:''}${S.help?helpPanel():''}${S.modal?modal():''}${S.palette?palette():''}`}

function stats(){return `<div class="metrics">${[[ 'target','Active missions',String(M.filter(x=>x.status==='running').length).padStart(2,'0'),'+2 this week',''],['users','Agent instances','24 / 28','85% utilization',''],['shield','Pending decisions','03','1 urgent approval','urgent'],['chart','Mission success','96.4%','+3.2% this month','success']].map(([ic,n,v,d,k])=>`<div class="panel metric ${k}"><div class="metric-icon">${icon(ic,21)}</div><div><div class="metric-name">${n}</div><div class="metric-value">${v}</div><div class="metric-desc">${d}</div></div></div>`).join('')}</div>`}
function missionRow(m,i){return `<div class="mission-row ${S.selected===i?'active':''}" tabindex="0" role="button" data-selmission="${i}" aria-label="Select mission ${h(m.title)}"><div class="mission-titleline"><span class="mission-title">${h(m.title)}</span><button class="tiny" data-act="editmission:${i}" title="Edit mission" aria-label="Edit mission">${icon('edit',12)}</button><button class="tiny" data-act="deletemission:${i}" title="Delete mission" aria-label="Delete mission">${icon('trash',12)}</button></div><div class="mission-sub"><span class="status ${m.status}">${m.status==='running'?'Executing':m.status==='review'?'Needs review':'Completed'}</span><span>${h(m.id)}</span></div><div class="mission-desc">${h(m.desc)}</div>${progress(m.progress)}<div class="mission-meta"><span>${m.progress}%</span><span>· ${h(m.ver)}</span><span>· Next ${h(m.next)}</span>${m.waiting?`<span class="issue pending">${icon('bell',10)}${m.waiting}</span>`:''}${m.issues?`<span class="issue">${icon('flag',10)}${m.issues}</span>`:''}</div></div>`}
function missions(){let m=current();return `${secHead('Mission Control','Coordinate mission execution, delegation, results and decisions in one view.',btn('plus','Add mission','newmission','primary')+ib('filter','filters','Filter missions'))}${stats()}<div class="mission-grid"><div class="panel col mission-list-col"><div class="panel-head"><div><div class="panel-title">Mission portfolio</div><div class="panel-desc">${M.length} missions · select to inspect</div></div>${help('Mission portfolio')}</div><div class="mission-filter"><input id="mission-search" class="text-input" placeholder="Filter missions..." value="${h(S.search)}" aria-label="Search missions"/>${ib('search','searchmissions','Search mission titles')}</div><div class="mission-scroll" id="mission-scroll">${M.map((x,i)=>missionRow(x,i)).join('')}</div><div class="mini-footer">${btn('plus','New mission','newmission','primary')}${btn('archive','Archive','archiveMission','soft')}</div></div><div class="panel mission-main"><div class="mission-banner"><div><h2>${h(m.title)} ${help('Selected mission')}</h2><p>${h(m.id)} · ${m.agents} agent instances · ${m.ver} · next edition ${h(m.next)}</p></div><div class="mission-banner-right">${badge(m.status==='running'?'● Executing':m.status==='review'?'◷ Needs approval':'✓ Completed',m.status==='running'?'good':'warn')}<div class="big-progress" style="--percent:${m.progress}%"><span>${m.progress}%</span></div>${ib('more','missionactions','Mission actions')}</div></div>${tabRow(['Hierarchy','Task Flow','Activity Log','Conversations','Approvals','Reports','Results','Versions','Preview'])}<div class="mission-detail" id="mission-detail">${missionDetail()}</div></div><div class="panel chat-col ${S.chatOpen?'show':''}">${chatPanel()}</div></div>`}
function tabRow(names){return `<nav class="tabs" role="tablist">${names.map(n=>`<button role="tab" aria-selected="${S.tab===n}" class="tab ${S.tab===n?'active':''}" data-tab="${h(n)}">${h(n)}</button>`).join('')}</nav>`}
function missionDetail(){switch(S.tab){case'Hierarchy':return hierarchy();case'Task Flow':return taskFlow();case'Activity Log':return activity();case'Conversations':return conversationsTab();case'Approvals':return approvalsInline();case'Reports':return reports();case'Results':return results();case'Versions':return versionsInline();case'Preview':return preview();default:return hierarchy()}}
function node(a){return `<div class="agent-node ${S.agent===a.id?'active':''}" role="button" tabindex="0" data-agent="${a.id}" aria-label="Inspect ${a.id} agent"><div class="node-icon">${icon(a.icon,15)}</div><strong>${h(a.id)}</strong><small>${h(a.role)}</small><em>${h(a.st)}</em></div>`}
function hierarchy(){return `<div class="section-strip"><span class="smallcap">ACTIVE AGENT HIERARCHY ${help('Agent hierarchy')}</span><span class="badge good">${icon('spark',11)} Live delegation</span></div><div class="hierarchy"><svg class="org-lines" viewBox="0 0 600 310" preserveAspectRatio="none"><path d="M300 74V104H158V127M300 104H447V127"/><path class="soft-line" d="M158 198V232H72V250M158 232H260V250M447 198V232H530V250"/></svg><div class="org-tree"><div class="level">${node(A[0])}</div><div class="level" style="max-width:410px;justify-content:space-between">${node(A[1])}${node(A[2])}</div><div class="level" style="max-width:505px;justify-content:space-between">${node(A[4])}${node(A[3])}${node(A[5])}</div></div></div><div class="legend"><span>Active reporting line</span><span>Delegation</span><span>Agent version pinned to mission</span></div><div class="section-strip" style="margin-top:16px"><span class="smallcap">Current workflow</span>${help('Current workflow')}</div><div class="workrows">${tasks.slice(2).map(t=>`<div class="workrow"><div class="wicon">${icon(t.id==='T-03'?'terminal':t.id==='T-04'?'browser':'shield',15)}</div><div><b>${h(t.name)}</b><small>${h(t.owner)} · ${t.state==='review'?'Awaiting verification':t.state==='running'?'Running in isolated workspace':'Completed'}</small></div>${progress(t.pct)}</div>`).join('')}</div>`}
function chatPanel(){let ag=agent();let thread=[...(replies[S.counterpart]||replies.Research),...S.extraMessages.filter(x=>x.agent===S.agent&&x.person===S.counterpart).map(x=>['You',x.time,x.text])];return `<div class="chat-agent-head"><div class="chat-agent-top"><div class="face">${icon(ag.icon,17)}</div><div style="flex:1"><strong>${h(ag.id)} · ${h(ag.role)}</strong><small>Mission agent · ${h(ag.st)} · ${current().id}</small></div>${ib('maximize','chatmaximize','Expand agent conversation','blue')}${ib('x','chatclose','Close floating chat')}</div></div><div class="people">${['Research','Development','QA','Superior','Team'].map(p=>`<button class="person ${S.counterpart===p?'active':''}" data-person="${p}">${icon('message',11)}${p}</button>`).join('')}</div><div class="chat-stream" id="chat-stream">${thread.map(([from,time,txt])=>`<div class="msg ${from==='You'?'self':''}"><div class="msg-head"><span>${h(from)} · ${h(time)}</span><button class="msg-copy" title="Copy message" data-copy="${h(txt)}" aria-label="Copy message">${icon('copy',11)}</button></div><div class="bubble">${h(txt)}</div>${from==='You'?'<div class="msg-foot">✓ Instruction recorded (demo)</div>':''}</div>`).join('')}</div><div class="compose"><textarea id="agent-message" aria-label="Command or reply to agent" placeholder="Send instructions to ${h(ag.id)}... (Ctrl+Enter)"></textarea>${S.attachments.length?`<div class="attachment-bar">${S.attachments.map(x=>`<span class="file-pill">${icon('paperclip',11)} ${h(x)}</span>`).join('')}</div>`:''}<div class="compose-tools"><div class="compose-buttons">${ib('paperclip','attach','Attach a document')}${ib('image','attach-image','Attach an image')}${help('Agent commands')}</div>${btn('send','Send','sendmessage','primary')}</div></div>`}
function taskFlow(){let t=tasks[S.task];return `<div class="flow-layout"><div class="subpanel"><div class="section-strip"><h3>Execution dependency graph</h3>${help('Task flow')}</div><div class="task-dag"><svg viewBox="0 0 420 285" preserveAspectRatio="none"><path d="M105 55V104H105V122M315 55V104H315V122M105 180V212H210V235M315 180V212H210V235"/></svg><div class="task-level">${tasks.slice(0,2).map((t,i)=>taskNode(t,i)).join('')}</div><div class="task-level">${tasks.slice(2,4).map((t,i)=>taskNode(t,i+2)).join('')}</div><div class="task-level" style="max-width:180px">${taskNode(tasks[4],4)}</div></div></div><div><div class="subpanel"><h3>Selected task · ${h(t.name)}</h3>${line('Task ID',t.id)}${line('Owner',t.owner)}${line('State',t.state==='done'?'Verified':t.state==='running'?'Running':'Pending QA')}<p style="font-size:10px;color:var(--muted)">Dependency checks, scoped execution, evidence and handoff are visible to the supervising agent.</p>${progress(t.pct)}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${btn('play','Resume','demo-resume','small')}${btn('pause','Pause','demo-pause','small')}${btn('refresh','Retry','demo-retry','small')}</div></div><div class="subpanel" style="margin-top:10px"><h3>Execution checkpoints</h3><div class="detail-list">${['Input validated','Scoped workspace created','Independent QA checks','Merge approval needed'].map((s,i)=>`<div class="detail-item" style="display:flex;align-items:center;gap:8px">${icon(i===3?'clock':'check',13)} <b>${s}</b></div>`).join('')}</div></div></div></div>`}
function taskNode(t,i){return `<button class="task-node ${S.task===i?'active':''}" data-task="${i}"><b>${t.id} ${h(t.name)}</b><small style="color:${t.state==='done'?'var(--good)':t.state==='running'?'var(--accent)':'var(--warn)'}">${t.state==='done'?'DONE':t.state==='running'?'RUNNING':'BLOCKED'}</small></button>`}
function activity(){return `<div class="section-strip"><span class="smallcap">Mission events · latest first</span>${btn('download','Export','downloadDemo','small')}</div><div class="two-pane"><div class="list-compact">${[['10:42:16','Task started','Nova began implementing the selected UI workstream','good'],['10:41:22','Approval granted','Owner authorized isolated preview deployment','good'],['10:39:08','QA issue found','Aegis identified two contrast problems','warn'],['10:36:51','Workspace created','Branch feature/task-flow generated','good'],['10:31:05','Plan accepted','General Manager distributed scoped tasks','good']].map((x,i)=>`<div class="detail-item ${i===0?'active':''}" data-act="inspectevent"><div class="row-head"><b>${x[0]} · ${x[1]}</b>${badge(x[3]==='good'?'SUCCESS':'REVIEW',x[3])}</div><small>${x[2]}</small></div>`).join('')}</div><div class="subpanel"><h3>Event details & evidence</h3>${line('Event ID','evt_1092')}${line('Actor','Nova · UI Builder')}${line('Correlation','run_048')}${line('Audit','Immutable record')}${btn('copy','Copy trace','copytrace','small')}</div></div>`}

function approvalsInline(){return `<div class="section-strip"><span class="smallcap">Waiting for your decision</span>${help('Decision queue')}</div><div class="detail-list">${[['Deploy preview release 1.4.0','High · Safe staging environment · review candidate'],['Create connected GitHub repository','High · Owner authorization required'],['Additional browser compute budget','Medium · Proposed +$15.00 ceiling']].map((x,i)=>`<div class="detail-item"><div class="row-head"><b>${h(x[0])}</b>${badge(i===0?'HIGH':'PENDING',i===0?'bad':'warn')}</div><small>${h(x[1])}</small><div style="margin-top:9px">${btn('eye','Review options','approve:'+i,'small soft')}</div></div>`).join('')}</div>`}

function helpPanel(){let topic=S.help;const explain={'Agent hierarchy':'The live hierarchy shows who reports to whom. Animated lines represent delegation and handoffs. Click an agent to inspect their conversation on the right.','Current workflow':'Each work item is linked to a mission-scoped agent instance. Progress represents illustrative verified task completion.','Task flow':'Dependencies must finish before subsequent tasks can begin. Task selection shows owner, status, checkpoints and gated controls.','Conversation formats':'View a specific agent pair or the full process and reports. Every message has a time stamp and copy action.','Edition timeline':'Every release has an immutable version and audit trail. Preview and download actions here use sample files.','Appearance presets':'Choose Flat, Luminous, Pretty or Fancy. All four themes can be combined with light/dark mode and density.','Agent autonomy':'Agent experiments may run automatically but production release, permission expansion, and final external submissions require policy-enforced authorization.'};return `<aside class="help-pop" role="dialog" aria-label="Context help"><div style="display:flex;align-items:center;justify-content:space-between"><span class="eyebrow">CONTEXT HELP</span>${ib('x','closehelp','Close help')}</div><h2>${h(topic)}</h2><p>${h(explain[topic]||'This panel explains the purpose of the selected control, its related data, permissions, and expected interactions. All actions in this HTML are simulated and do not affect any external server.')}</p><h3 style="font-size:12px;margin-top:20px">Quick tips</h3><ul><li>Use icon tooltips or the ? help control for explanations.</li><li>Press Ctrl/⌘ + K to open the command palette.</li><li>Select any agent in the hierarchy to open related conversations.</li><li>Switch light/dark themes from the top navigation.</li><li>The sample data is never sent to any server.</li></ul>${btn('check','Got it','closehelp','primary')}</aside>`}
function modal(){let t=S.modal;let title=t==='newmission'?'Create a new mission':t==='editmission'?'Edit mission':t==='deletemission'?'Delete mission':t==='invite'?'Invite user':t==='agentprofile'?'Agent profile':t==='approve'?'Decision review':t==='newagent'?'Create agent':t==='newmodel'?'Register model':t==='newsource'?'Add research source':t==='newsession'?'Create browser session':t==='newexperiment'?'New evolution experiment':'Preview action';return `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-h"><h2 id="modal-title">${title}</h2>${ib('x','closemodal','Close dialog')}</div><div class="modal-b">${modalBody()}</div><div class="modal-f">${btn('x','Cancel','closemodal')}${t==='deletemission'?btn('trash','Delete mission','confirmmodal','red'):t==='agentprofile'?btn('message','Chat with agent','modalchat','primary'):btn('check',t==='newmission'?(S.step===3?'Create demo mission':'Next step'):'Confirm','confirmmodal','primary')}</div></div></div>`}
function modalBody(){let t=S.modal,m=current();if(t==='newmission')return `<div class="wizard-steps">${['1 Goal','2 Resources','3 Budget','4 Review'].map((x,i)=>`<div class="wizard-step ${i===S.step?'active':''}">${x}</div>`).join('')}</div>${S.step===0?`<div class="field"><label>Mission title</label><input id="f-title" value="${h(S.modalData.title||'')}" placeholder="AI proposes a title after reviewing your mission"/></div><div class="field"><label>Mission objective *</label><textarea id="f-desc" placeholder="Describe desired outcome, success criteria and execution boundaries...">${h(S.modalData.desc||'')}</textarea></div>`:S.step===1?`<div class="field"><label>GitHub repository (optional)</label><input id="f-repo" value="${h(S.modalData.repo||'')}" placeholder="https://github.com/organization/repository"/><small>New repository creation would require approval in the connected application.</small></div><div class="uploadbox" data-act="attach">${icon('upload',25)}<p>Select images, PDFs or documents</p><small>Attachments are shown locally in this demo</small></div>${S.attachments.map(x=>`<span class="file-pill">${icon('file',12)} ${h(x)}</span>`).join('')}`:S.step===2?`<div class="field"><label>Maximum mission budget (USD)</label><input id="f-budget" type="number" min="0" value="${h(S.modalData.budget||'50')}"/></div><div class="field"><label>Autonomy level</label><select id="f-autonomy"><option>Level 2 · Scoped tasks, external effects approved</option><option>Level 1 · Review every browser action</option><option>Level 3 · Autonomous internal planning, gated promotion</option></select></div><div class="hint">External submissions, repository creation and source-code deployment require independent owner approvals.</div>`:`<p>Review the simulated mission before creation:</p>${line('Objective',S.modalData.desc||'—')}${line('Repository',S.modalData.repo||'Requires approval to create')}${line('Budget','$'+(S.modalData.budget||'50'))}<div class="hint">The HTML will create a local demo mission only; no GitHub repository or browser will be started.</div>`}${S.step>0?`<div style="margin-top:16px">${btn('chevron','Back','wizardback','small')}</div>`:''}`;
if(t==='editmission')return `<div class="field"><label>Title</label><input id="f-title" value="${h(m.title)}"/></div><div class="field"><label>Description</label><textarea id="f-desc">${h(m.desc)}</textarea></div>`;
if(t==='deletemission')return `<p>Delete <b>${h(m.title)}</b> from this local demonstration?</p><div class="hint">Only demo data in this page is modified. Production deletions would need role permission, confirmation and an audit record.</div>`;
if(t==='agentprofile'){let a=agent();return `<div class="agent-head" style="margin-bottom:17px"><div class="face">${icon(a.icon,24)}</div><div><b>${a.id}</b><small>${a.role} · ${a.st}</small></div></div>${line('Reliability',a.rate+'%')}${line('Agent baseline','v2.1.0')}${line('Active mission instances',a.missions)}${line('Role specialty',a.sub)}<div class="divider"></div><b>Capabilities</b><div class="ratingbar"><span style="width:${a.rate}%"></span></div><p style="color:var(--muted);font-size:11px">Experience is consolidated into future versions only after independent evaluation, promotion approval and regression checks.</p>`}
if(t==='approve')return `<div class="hint">Approval request · scoped action · mission ${h(current().id)}</div><h3>Deploy isolated preview release?</h3><p style="color:var(--muted)">Review the candidate, inspect evidence, then provide an answer. This demo never deploys anything.</p><div class="field"><label>Decision</label><select id="f-decision"><option>Approve (demo)</option><option>Request changes (demo)</option><option>Reject (demo)</option></select></div><div class="field"><label>Comments or additional instructions</label><textarea id="f-comment" placeholder="Send guidance or evidence to the agent..."></textarea></div>${btn('image','Attach image','attach-image','small')}`;
if(t==='invite')return `<div class="field"><label>Email address</label><input type="email" id="f-title" placeholder="teammate@example.com"/></div><div class="field"><label>Role</label><select><option>Viewer</option><option>Member</option><option>Admin</option></select></div>`;
if(t==='newagent')return `<div class="field"><label>Agent name</label><input id="f-title" placeholder="e.g. Architect Agent"/></div><div class="field"><label>Agent responsibility</label><textarea id="f-desc" placeholder="Capabilities, scope, model and permissions..."></textarea></div>`;
if(t==='newmodel')return `<div class="field"><label>Model ID</label><input id="f-title" placeholder="Provider/model"/></div><div class="field"><label>Model type</label><select><option>LLM</option><option>STT</option><option>TTS</option><option>Embedding</option></select></div><div class="hint">API keys are not collected by this offline HTML mockup.</div>`;
if(t==='newsource')return `<div class="field"><label>Research source URL</label><input id="f-title" placeholder="https://example.org/research"/></div><div class="field"><label>Trust / source description</label><textarea id="f-desc" placeholder="Owner, provenance and update schedule"></textarea></div>`;
if(t==='newsession')return `<div class="field"><label>Allowed website origin</label><input id="f-title" placeholder="https://example.org"/></div><div class="field"><label>Execution mode</label><select><option>Isolated Playwright Chromium</option><option>Demo browser only</option></select></div><div class="hint">This preview will not connect to or execute in any real browser. Production requires explicit origin grants and runtime service.</div>`;
if(t==='newexperiment')return `<div class="field"><label>Experiment hypothesis</label><input id="f-title" placeholder="A change that could improve verified outcomes"/></div><div class="field"><label>Evaluation criteria</label><textarea id="f-desc" placeholder="Baseline, candidate, benchmark and safety gates..."></textarea></div>`;
return `<div class="hint">This action is a UI simulation only. No external service, browser, release or repository is affected.</div>`}
function palette(){return `<div class="palette-backdrop" id="palette-backdrop"><div class="palette"><input id="palette-input" placeholder="Search workspace or jump to a page..." aria-label="Search command palette"/><div class="palette-results">${nav.flatMap(x=>x[1]).map(x=>`<button class="palette-result" data-page="${x[0]}">${icon(x[2],15)} ${x[1]}</button>`).join('')}</div></div></div>`}
function render(keep=false){let scroll=keep?document.querySelector('#mission-scroll')?.scrollTop||0:0;document.getElementById('app').innerHTML=shell();if(keep&&document.querySelector('#mission-scroll'))document.querySelector('#mission-scroll').scrollTop=scroll;bind();}
function toast(t){let box=document.querySelector('#toasts'),el=document.createElement('div');el.className='toast';el.appendChild(document.createTextNode('✓ '+t));box.appendChild(el);setTimeout(()=>el.remove(),3600)}
function pageTo(p){S.page=p;S.modal=null;S.palette=false;S.help=null;S.chatOpen=false;if(p==='missions'&&S.tab==='')S.tab='Hierarchy';render()}
function filePicker(imageOnly){let input=document.querySelector('#global-file');input.accept=imageOnly?'image/*':'image/*,.pdf,.txt,.md,.docx,.xlsx';input.click()}
function downloadDemo(){let m=current();let txt=`AXoR DESIGN PROTOTYPE — SAMPLE ARTIFACT MANIFEST\nMission: ${m.title}\nVersion: ${m.ver}\nReference commit: fb0a84f564a81fa673b72fc03016805eea8554d7\n\nThis file is an example. No real version or build is included.\n`;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.href=url;a.download=`AXoR-DEMO-${m.ver}-manifest.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function doAct(act){if(act.startsWith('page:')){pageTo(act.split(':')[1]);return}if(act.startsWith('theme:')){S.theme=act.split(':')[1];persist();render(true);toast(`${S.theme} mode enabled`);return}if(act==='theme'){S.theme=S.theme==='light'?'dark':'light';persist();render(true);toast(`Theme changed to ${S.theme}`);return}if(act.startsWith('density:')){S.density=act.split(':')[1];persist();render(true);return}if(act.startsWith('motion:')){S.motion=act.split(':')[1];persist();render(true);return}if(act==='resetTheme'){S.theme='light';S.style='flat';S.density='normal';S.motion='on';persist();render();toast('Appearance restored to Flat Light');return}if(act.startsWith('editmission:')){S.selected=+act.split(':')[1];S.modal='editmission';render(true);return}if(act.startsWith('deletemission:')){S.selected=+act.split(':')[1];S.modal='deletemission';render(true);return}if(act.startsWith('agentprofile:')){S.agent=act.split(':')[1];S.modal='agentprofile';render(true);return}if(act.startsWith('chat:')){S.agent=act.split(':')[1];pageTo('missions');S.chatOpen=true;render();return}if(act.startsWith('approve:')){S.modal='approve';render(true);return}if(act.startsWith('thread:')){S.counterpart=act.split(':')[1];S.tab='Hierarchy';render(true);return}if(act==='newmission'){S.modal='newmission';S.step=0;S.modalData={};S.attachments=[];render(true);return}if(['invite','newagent','newmodel','newsource','newsession','newexperiment'].includes(act)){S.modal=act;render(true);return}if(act==='closemodal'){S.modal=null;render(true);return}if(act==='wizardback'){S.step=Math.max(0,S.step-1);render(true);return}if(act==='confirmmodal'){confirmModal();return}if(act==='modalchat'){S.modal=null;S.page='missions';S.tab='Hierarchy';S.chatOpen=true;render();return}if(act==='closehelp'){S.help=null;render(true);return}if(act.startsWith('help:')){S.help=act.split(':')[1];render(true);return}if(act==='palette'){S.palette=true;render(true);document.getElementById('palette-input')?.focus();return}if(act==='filters'){S.filter=S.filter==='all'?'running':'all';toast(`Mission filter: ${S.filter}`);refreshMissionList();return}if(act==='searchmissions'){document.getElementById('mission-search')?.focus();return}if(act==='archiveMission'){toast('Archive is simulated; missions remain unchanged');return}if(act==='sendmessage'){let e=document.querySelector('#agent-message'),s=e?.value.trim();if(!s){toast('Type a command or reply first');return}S.extraMessages.push({agent:S.agent,person:S.counterpart,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),text:s});S.attachments=[];render(true);document.querySelector('#chat-stream')?.scrollTo(0,9999);toast('Message added to the demo conversation');return}if(['attach','attach-image'].includes(act)){filePicker(act==='attach-image');return}if(act==='chatmaximize'){S.chatOpen=true;document.querySelector('.chat-col')?.classList.toggle('show');toast('Chat panel expanded where supported');return}if(act==='chatclose'){S.chatOpen=false;document.querySelector('.chat-col')?.classList.remove('show');return}if(act==='downloadDemo'){downloadDemo();toast('Downloaded sample manifest — not a real build');return}if(act==='copychat'){navigator.clipboard?.writeText((replies[S.counterpart]||[]).map(x=>x.join(' | ')).join('\n')).then(()=>toast('Demo conversation copied')).catch(()=>toast('Clipboard permission unavailable'));return}if(act==='copytrace'){navigator.clipboard?.writeText('evt_1092 | run_048 | UI prototype').then(()=>toast('Event trace copied')).catch(()=>toast('Copy unavailable'));return}if(act==='savePrefs'){persist();toast('Appearance saved in this browser');return}if(act==='runDemo'||act==='refreshPreview'||act==='captureDemo'||act==='inspectbrowser'||act==='inspectevent'||act==='showreport'||act==='configuremodel'||act==='userpermissions'||act==='approvals-history'||act==='missionactions'||act.startsWith('demo-')){toast('UI simulation only — no Playwright or VPS action was performed');return}toast('Prototype action selected — backend not connected')}
function confirmModal(){let t=S.modal;if(t==='newmission'){if(S.step===0){let goal=document.getElementById('f-desc')?.value.trim(),title=document.getElementById('f-title')?.value.trim();if(!goal){toast('Please provide the mission objective');return}S.modalData.desc=goal;S.modalData.title=title||goal.split(/[.!?\n]/)[0].slice(0,42)||'New mission'}if(S.step===1)S.modalData.repo=document.getElementById('f-repo')?.value.trim()||'';if(S.step===2)S.modalData.budget=document.getElementById('f-budget')?.value||'50';if(S.step<3){S.step++;render(true);return}M.unshift({id:'MIS-NEW',title:S.modalData.title,desc:S.modalData.desc,status:'review',progress:0,ver:'v0.1.0',next:'Pending',issues:1,waiting:1,agents:1});S.selected=0;S.page='missions';S.tab='Hierarchy';toast('Local demo mission created; no repository created')}
else if(t==='editmission'){let v=document.getElementById('f-title')?.value.trim(),d=document.getElementById('f-desc')?.value.trim();if(v)current().title=v;if(d)current().desc=d;toast('Mission updated locally')}
else if(t==='deletemission'){M.splice(S.selected,1);S.selected=0;toast('Demo mission removed from this page')}
else{toast('Demo input acknowledged; no external action was taken')}S.modal=null;render(true)}
function refreshMissionList(){let list=document.querySelector('#mission-scroll');if(!list)return;let text=(S.search||'').toLowerCase();list.innerHTML=M.map((m,i)=>({m,i})).filter(({m})=>(!text||[m.title,m.desc,m.id].some(x=>x.toLowerCase().includes(text)))&&(S.filter==='all'||m.status===S.filter)).map(({m,i})=>missionRow(m,i)).join('')||'<div style="padding:20px;color:var(--muted)">No matching missions</div>';bind(list)}
function bind(root=document){root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>pageTo(b.dataset.page));root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render(true)});root.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();doAct(b.dataset.act)});root.querySelectorAll('[data-help]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.help=b.dataset.help;render(true)});root.querySelectorAll('[data-selmission]').forEach(b=>{b.onclick=()=>{S.selected=Number(b.dataset.selmission);render(true)};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});root.querySelectorAll('[data-agent]').forEach(b=>{b.onclick=()=>{S.agent=b.dataset.agent;S.chatOpen=true;render(true)};b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();b.click()}}});root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{S.counterpart=b.dataset.person;render(true)});root.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{S.task=+b.dataset.task;render(true)});root.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{S.version=+b.dataset.version;render(true)});root.querySelectorAll('[data-agentprofile]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-act]'))return;S.agent=b.dataset.agentprofile;S.modal='agentprofile';render(true)});root.querySelectorAll('[data-jumpmission]').forEach(b=>b.onclick=()=>{S.selected=+b.dataset.jumpmission;pageTo('missions')});root.querySelectorAll('[data-style-choice]').forEach(b=>b.onclick=()=>{S.style=b.dataset.styleChoice;persist();render();toast(`${S.style} appearance applied`)});root.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{S.style=({Blue:'flat',Cyan:'luminous',Rose:'pretty',Violet:'fancy'})[b.dataset.color];persist();render();toast(`${b.dataset.color} color applied`)});root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let key=b.dataset.toggle;S.settings[key]=!S.settings[key];render(true);toast(`${key}: ${S.settings[key]?'on':'off'} (demo only)`)});root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast('Message copied')).catch(()=>toast('Clipboard unavailable'))});let m=root.querySelector('#mission-search');if(m)m.oninput=e=>{S.search=e.target.value;refreshMissionList();let inp=document.getElementById('mission-search');if(inp){inp.focus();inp.setSelectionRange(S.search.length,S.search.length)}};let modalBg=root.querySelector('#modal-backdrop');if(modalBg)modalBg.onclick=e=>{if(e.target===modalBg){S.modal=null;render(true)}};let p=root.querySelector('#palette-input');if(p)p.oninput=()=>{root.querySelectorAll('.palette-result').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(p.value.toLowerCase())?'flex':'none')};let pbg=root.querySelector('#palette-backdrop');if(pbg)pbg.onclick=e=>{if(e.target===pbg){S.palette=false;render(true)}}}
document.querySelector('#global-file').addEventListener('change',e=>{let f=[...e.target.files];if(f.length){S.attachments.push(...f.map(x=>x.name));toast(`${f.length} file(s) selected for demo only`);render(true)}e.target.value=''});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.palette=!S.palette;render(true);document.getElementById('palette-input')?.focus()}else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='agent-message'){e.preventDefault();doAct('sendmessage')}else if(e.key==='Escape'){if(S.modal||S.help||S.palette){S.modal=null;S.help=null;S.palette=false;render(true)}}});render();
</script>
</body></html>
